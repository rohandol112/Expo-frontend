# OPTIONAL reverse proxy in front of the SSR Node server.
#
# Coolify already provisions Traefik + Let's Encrypt TLS in front of the
# container, so for a standard Coolify deploy you do NOT need this file — just
# point Coolify at the Dockerfile and set the domain. Use this only if you want
# to run your own nginx (e.g. a separate nginx service that proxies to the app
# container named `app` on port 3000).

upstream admin_app {
  server app:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             application/xml text/xml image/svg+xml application/wasm font/woff2;

  # Long-cache content-hashed static assets emitted by Vite.
  location /assets/ {
    proxy_pass http://admin_app;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Everything else -> SSR Node server (supports websockets for HMR/streaming).
  location / {
    proxy_pass http://admin_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
